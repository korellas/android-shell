name: android_shell_ui
publish_to: none
description: Tilde SSH and terminal interface.
version: 1.0.0+1
environment:
  sdk: ^3.11.3
dependencies:
  xterm2:
    git:
      url: https://github.com/korellas/xterm2.git
      ref: 1d8360b001ab88bc92154d826077850ccafbf154
  dartssh2:
    path: third_party/dartssh2
  asn1lib: 1.6.7
  pointycastle: 4.0.0
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  assets:
    - assets/fonts/Pretendard-LICENSE.txt
    - assets/fonts/JetBrainsMono-OFL.txt
  uses-material-design: true
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
  module:
    androidX: true
    androidPackage: dev.korellas.android_shell_ui
    iosBundleIdentifier: dev.korellas.androidShellUi
