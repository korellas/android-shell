name: CI Build

on:
  workflow_call:
    inputs:
      is_push:
        required: true
        type: boolean
    secrets:
      GRADLE_CACHE_ENCRYPTION_KEY:
        required: false
      SIGNER_WEBHOOK_URL:
        required: false
      SONAR_TOKEN:
        required: false

env:
  FLUTTER_REVISION: 2c9eb20739dfec95e2c74bd3dfa4601b0a8a36aa
  FLUTTER_VERSION: 3.41.5

jobs:
  check-inputs:
    name: Check workflow inputs
    runs-on: ubuntu-latest
    outputs:
      has-sonar-token: ${{ steps.sonar-token.outputs.defined }}
    steps:
      - id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: "${{ env.SONAR_TOKEN != '' }}"
        run: echo "defined=true" >> "$GITHUB_OUTPUT"

  flutter:
    name: Flutter checks and module
    runs-on: ubuntu-latest
    needs: [check-inputs]
    permissions:
      contents: read

    steps:
      - name: Checkout (with history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Delete old Android SDK cmdline-tools
        run: |
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Set up Flutter
        run: |
          flutter_sdk="$RUNNER_TEMP/flutter-sdk"
          git init "$flutter_sdk"
          git -C "$flutter_sdk" remote add origin https://github.com/flutter/flutter.git
          git -C "$flutter_sdk" fetch --depth 1 origin "$FLUTTER_REVISION" "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$flutter_sdk" checkout --detach "$FLUTTER_REVISION"
          echo "$flutter_sdk/bin" >> "$GITHUB_PATH"
          "$flutter_sdk/bin/flutter" --version

      - name: Check app-local SSH package
        working-directory: flutter_ui/third_party/dartssh2
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test --exclude-tags integration

      - name: Build Flutter module
        working-directory: flutter_ui
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build aar --no-profile

      - name: Share Flutter Maven repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-aar-repository
          path: flutter_ui/build/host/outputs/repo/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify:
    name: Checks and unit tests
    runs-on: ubuntu-latest
    needs: [check-inputs, flutter]
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout (with history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: generate-and-submit
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Delete old Android SDK cmdline-tools
        run: |
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Restore Flutter Maven repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flutter-aar-repository
          path: flutter_ui/build/host/outputs/repo/

      - name: Run checks and unit coverage
        run: ./gradlew --profile spotlessCheck :app:lintOssDebug :app:lintGoogleDebug :app:testOssDebugUnitTest :app:testGoogleDebugUnitTest --tests org.connectbot.util.GoogleLanguagePackManagerTest :app:koverXmlReportOssDebug :app:koverXmlReportGoogleDebug

      - name: Store Gradle profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-profile-verify
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect SonarQube inputs
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        run: |
          tar -cf sonar-verify.tar \
            app/build/reports/kover \
            app/build/reports/lint-results-*.xml \
            app/build/intermediates/classes \
            app/build/intermediates/javac \
            app/build/test-results

      - name: Store SonarQube inputs
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-verify
          path: sonar-verify.tar
          if-no-files-found: error

  release:
    name: Release ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    needs: [check-inputs, flutter]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - flavor: oss
            task: Oss
          - flavor: google
            task: Google

    steps:
      - name: Checkout (with history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Delete old Android SDK cmdline-tools
        run: rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Restore Flutter Maven repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flutter-aar-repository
          path: flutter_ui/build/host/outputs/repo/

      - name: Build release APK and bundle
        env:
          FLAVOR_TASK: ${{ matrix.task }}
          IS_PUSH: ${{ inputs.is_push }}
        run: |
          tasks=(":app:assemble${FLAVOR_TASK}Release")
          if [[ "$IS_PUSH" == 'true' ]]; then
            tasks+=(":app:bundle${FLAVOR_TASK}Release")
          fi
          ./gradlew --profile "${tasks[@]}"

      - name: Store Gradle profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-profile-release-${{ matrix.flavor }}
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 14

      - name: Attest unsigned Android artifacts
        if: ${{ inputs.is_push }}
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            app/build/outputs/apk/${{ matrix.flavor }}/release/app-${{ matrix.flavor }}-release-unsigned.apk
            app/build/outputs/bundle/${{ matrix.flavor }}Release/app-${{ matrix.flavor }}-release.aab

      - name: Package release outputs
        if: ${{ inputs.is_push }}
        env:
          FLAVOR: ${{ matrix.flavor }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "provenance-${FLAVOR}.json"
          outputs=(
            "app/build/outputs/apk/${FLAVOR}/release/app-${FLAVOR}-release-unsigned.apk"
            "app/build/outputs/bundle/${FLAVOR}Release/app-${FLAVOR}-release.aab"
            "app/build/outputs/native-debug-symbols/${FLAVOR}Release/native-debug-symbols.zip"
            "app/build/outputs/mapping/${FLAVOR}Release/mapping.txt"
            "provenance-${FLAVOR}.json"
          )
          if [[ "$FLAVOR" == 'google' ]]; then
            outputs+=("app/build/outputs/app_versioning/googleRelease/version_code.txt")
          fi
          tar -cf "release-${FLAVOR}.tar" "${outputs[@]}"

      - name: Store release outputs
        if: ${{ inputs.is_push }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.flavor }}
          path: release-${{ matrix.flavor }}.tar
          if-no-files-found: error

  instrumentation:
    name: Android lifecycle and migrations
    runs-on: ubuntu-latest
    needs: [check-inputs, flutter]
    permissions:
      contents: read
    steps:
      - name: Checkout (with history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Delete old Android SDK cmdline-tools
        run: |
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Restore Flutter Maven repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flutter-aar-repository
          path: flutter_ui/build/host/outputs/repo/

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrument tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          disk-size: 2G
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --profile --no-parallel :app:connectedOssDebugAndroidTest :app:createOssDebugAndroidTestCoverageReport :app:connectedGoogleDebugAndroidTest :app:createGoogleDebugAndroidTestCoverageReport --continue

      - name: Store instrumentation test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

      - name: Store Gradle profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-profile-instrumentation
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect SonarQube inputs
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        run: |
          inputs=(
            "app/build/reports/coverage/androidTest/oss/debug/connected"
            "app/build/reports/coverage/androidTest/google/debug/connected"
          )
          for variant in ossDebug googleDebug; do
            if [[ -d "app/build/intermediates/javac/${variant}AndroidTest" ]]; then
              inputs+=("app/build/intermediates/javac/${variant}AndroidTest")
            fi
          done
          tar -cf sonar-instrumentation.tar "${inputs[@]}"

      - name: Store SonarQube inputs
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-instrumentation
          path: sonar-instrumentation.tar
          if-no-files-found: error

  analysis:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: [check-inputs, verify, instrumentation]
    permissions:
      contents: read

    steps:
      - name: Checkout (with history)
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
          cache-read-only: true

      - name: Delete old Android SDK cmdline-tools
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        run: rm -rf "$ANDROID_HOME/cmdline-tools/latest"

      - name: Setup Android SDK
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'cmdline-tools;latest platform-tools'

      - name: Download SonarQube inputs
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sonar-*
          merge-multiple: true

      - name: Restore SonarQube inputs
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        run: |
          tar -xf sonar-verify.tar
          tar -xf sonar-instrumentation.tar
          test -s app/build/reports/kover/reportOssDebug.xml
          test -s app/build/reports/kover/reportGoogleDebug.xml
          test -s app/build/reports/coverage/androidTest/oss/debug/connected/report.xml
          test -s app/build/reports/coverage/androidTest/google/debug/connected/report.xml

      - name: Run SonarQube analysis
        if: needs.check-inputs.outputs.has-sonar-token == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --profile :app:sonar -Dsonar.projectVersion=${{ github.sha }}

      - name: Store Gradle profile
        if: always() && needs.check-inputs.outputs.has-sonar-token == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gradle-profile-analysis
          path: build/reports/profile/
          if-no-files-found: warn
          retention-days: 14

  upload:
    name: Upload to GitHub releases
    needs: [verify, release, instrumentation, analysis]
    if: ${{ inputs.is_push && (github.repository == 'connectbot/connectbot') && ((github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (with history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download release outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true

      - name: Prepare release
        run: |
          tar -xf release-oss.tar
          tar -xf release-google.tar

          if git describe --exact-match; then
            GITHUB_TAG="$(git describe)"
            echo "${GITHUB_TAG}" > tag.txt
            echo "Release ${GITHUB_TAG}" > release-title.txt
          else
            GITHUB_TAG="git-$(git describe)"
            GITHUB_TITLE="$(git log -1 --pretty=%B | head -1)"
            echo "${GITHUB_TAG}" > tag.txt
            echo "${GITHUB_TAG}: ${GITHUB_TITLE}" > release-title.txt
          fi

          cp ./app/build/outputs/apk/oss/release/app-oss-release-unsigned.apk "ConnectBot-${GITHUB_TAG}-oss-unsigned.apk"
          cp ./app/build/outputs/apk/google/release/app-google-release-unsigned.apk "ConnectBot-${GITHUB_TAG}-google-unsigned.apk"
          cp ./app/build/outputs/bundle/googleRelease/app-google-release.aab "ConnectBot-${GITHUB_TAG}-google-unsigned.aab"
          cp ./app/build/outputs/bundle/ossRelease/app-oss-release.aab "ConnectBot-${GITHUB_TAG}-oss-unsigned.aab"
          cp ./app/build/outputs/native-debug-symbols/googleRelease/native-debug-symbols.zip "ConnectBot-${GITHUB_TAG}-google.native-debug-symbols.zip"
          cp ./app/build/outputs/native-debug-symbols/ossRelease/native-debug-symbols.zip "ConnectBot-${GITHUB_TAG}-oss.native-debug-symbols.zip"
          cp ./app/build/outputs/mapping/googleRelease/mapping.txt "ConnectBot-${GITHUB_TAG}-google.mapping.txt"
          cp ./app/build/outputs/mapping/ossRelease/mapping.txt "ConnectBot-${GITHUB_TAG}-oss.mapping.txt"
          cp ./app/build/outputs/app_versioning/googleRelease/version_code.txt .
          zstd -- ./*.mapping.txt

      - name: Store artifacts for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: |
            release-title.txt
            tag.txt
            version_code.txt
            provenance-oss.json
            provenance-google.json
            ConnectBot-*-unsigned.apk
            ConnectBot-*-unsigned.aab
            ConnectBot-*.native-debug-symbols.zip
            ConnectBot-*.mapping.txt.zst
          if-no-files-found: error

      - name: Set release name
        id: name
        run: |
          echo "RELEASE_TITLE=$(cat release-title.txt)" >> "$GITHUB_OUTPUT"
          echo "GITHUB_TAG=$(cat tag.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body: "Untested build"
          draft: true
          tag_name: ${{ steps.name.outputs.GITHUB_TAG }}
          name: ${{ steps.name.outputs.RELEASE_TITLE }}
          generate_release_notes: true
          files: |
            ConnectBot-*-unsigned.apk
            ConnectBot-*-unsigned.aab
            ConnectBot-*.native-debug-symbols.zip
            ConnectBot-*.mapping.txt.zst
            version_code.txt
            provenance-oss.json
            provenance-google.json

  signing:
    name: Trigger remote signing
    needs: upload
    if: ${{ inputs.is_push && (github.repository == 'connectbot/connectbot') && ((github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download artifacts from previous job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk

      - name: Prepare signing request
        id: request
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_DIGEST: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        # The reusable build workflow is the attestation signer. SOURCE_REF is
        # the original build ref, which can differ from the generated release tag.
        # The server must verify each unsigned APK/AAB before signing it.
        run: |
          data="$(jq -cn \
            --arg tag_id "$(cat tag.txt)" \
            --arg version_code "$(cat version_code.txt)" \
            --arg repo "$SOURCE_REPO" \
            --arg signer_workflow "${SOURCE_REPO}/.github/workflows/ci-build.yml" \
            --arg source_digest "$SOURCE_DIGEST" \
            --arg source_ref "$SOURCE_REF" \
            --arg run_id "$RUN_ID" \
            --arg run_attempt "$RUN_ATTEMPT" \
            '{tag_id: $tag_id, version_code: $version_code,
              repo: $repo, signer_workflow: $signer_workflow,
              source_digest: $source_digest, source_ref: $source_ref,
              run_id: $run_id, run_attempt: $run_attempt,
              provenance_bundles: {oss: "provenance-oss.json", google: "provenance-google.json"}}')"
          echo "data=$data" >> "$GITHUB_OUTPUT"

      - name: Call remote signer
        uses: distributhor/workflow-webhook@2381f0e9c7b6bf061fb1405bd0804b8706116369 # v3.0.8
        with:
          webhook_url: ${{ secrets.SIGNER_WEBHOOK_URL }}
          data: ${{ steps.request.outputs.data }}
