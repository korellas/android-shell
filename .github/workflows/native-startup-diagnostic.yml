name: Native startup diagnostic

on:
  push:
    branches: [diagnose/native-startup]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-read-only: true
      - run: rm -rf "$ANDROID_HOME/cmdline-tools/latest"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'cmdline-tools;latest platform-tools'
      - name: Restore exact merged-build Flutter module
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: flutter-aar-repository
          path: flutter_ui/build/host/outputs/repo/
          run-id: 40619119692
          github-token: ${{ github.token }}
      - name: Restore the exact APK that reproduced the direct-launch crash
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-startup-diagnostic
          path: build/prior-startup-observation/
          run-id: 40631435047
          github-token: ${{ github.token }}
      - name: Freeze the product APK including its version and signature
        run: |
          mkdir -p app/build/outputs/apk/google/debug
          cp build/prior-startup-observation/app/build/outputs/apk/google/debug/app-google-debug.apk app/build/outputs/apk/google/debug/app-google-debug.apk
          echo '175542f70a6a4cc2370616e302453e35e55a0e791eee26642c5a906dd85b0159  app/build/outputs/apk/google/debug/app-google-debug.apk' | sha256sum --check
      - name: Build minimal host with the identical Flutter engine and Dart kernel
        run: python3 .github/diagnostics/host_comparison.py prepare
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare product and minimal Flutter host startup
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          disk-size: 2G
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          script: python3 .github/diagnostics/host_comparison.py observe
      - name: Preserve every observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-startup-diagnostic
          path: |
            native-startup-results/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/google/debug/
          if-no-files-found: error
          retention-days: 7
